# Full device config, based on the stock home-assistant-voice.factory.yaml (26.6.0).
# Kept: improv over BLE/serial, so Wi-Fi saved on the device keeps working and a reset device can be set up again.
# Removed: firmware updates from firmware.esphome.io (they would replace this firmware with stock),
# the beta firmware switch and dashboard_import.
packages:
  # This is an inline package to prefix the on_client_connected with the wait_until action
  # It must appear before the actual package so it becomes the orignal config and the
  # on_client_connected list from the package config is appended onto this one.
  va_connected_wait_for_ble:
    voice_assistant:
      on_client_connected:
        - wait_until:
            not: ble.enabled
        - delay: 2s
    wifi:
      on_disconnect:
        - ble.enable:
  home-assistant-voice: !include home-assistant-voice.yaml

esphome:
  project:
    name: Nabu Casa.Home Assistant Voice PE
    version: 26.6.0-ganiushin.1

wifi:
  on_connect:
    - delay: 5s  # Gives time for improv results to be transmitted
    - ble.disable:
    - script.execute: control_leds

improv_serial:

esp32_ble:
  name: ha-voice-pe

esp32_improv:
  authorizer: center_button
  on_start:
    - lambda: id(improv_ble_in_progress) = true;
    - script.execute: control_leds
  on_provisioned:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds
  on_stop:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds
