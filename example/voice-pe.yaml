# Device config for Voice PE.
# Keeps what the stock firmware uses, so the device stays the same in Home Assistant:
# - name: home-assistant-voice-XXXXXX (MAC suffix), same as stock
# - API encryption key: the one Home Assistant already set on the device
# - Wi-Fi: credentials saved on the device during setup
packages:
  voice_pe: github://ganiushin/voice-pe-firmware/home-assistant-voice.factory.yaml@main
