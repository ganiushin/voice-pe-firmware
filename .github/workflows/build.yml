name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Own build job instead of esphome/workflows build.yml: that one sets the version by replacing "version: dev",
  # and Home Assistant treats "dev" as newer than any release, so a local build would never be offered an update.
  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set version
        id: version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: echo "version=${RELEASE_VERSION:-0.0.0-ci.${{ github.run_number }}}" >> "$GITHUB_OUTPUT"

      - name: Build
        id: esphome-build
        uses: esphome/build-action@6b9d3f593d626a2f0d2c17daebf0a97957d67425  # v8.0.0
        with:
          yaml-file: home-assistant-voice.factory.yaml
          version: 2026.9.0
          complete-manifest: true
          substitutions: firmware_version=${{ steps.version.outputs.version }}
          release-summary: ${{ github.event_name == 'release' && github.event.release.body || '' }}
          release-url: ${{ github.event_name == 'release' && github.event.release.html_url || '' }}

      # Layout expected by upload-to-gh-release.yml: <artifact name>/<version>/
      - name: Arrange files
        env:
          NAME: ${{ steps.esphome-build.outputs.original-name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "output/$NAME/$VERSION"
          mv ${{ steps.esphome-build.outputs.name }}/* "output/$NAME/$VERSION/"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.esphome-build.outputs.original-name }}
          path: output

  upload-to-release:
    name: Upload to Release
    if: github.event_name == 'release'
    needs:
      - build-firmware
    permissions:
      contents: write
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@0fdd5e311b7e744069166696072a1a9cbc5fbeb6  # 2026.8.1
    with:
      version: ${{ github.event.release.tag_name }}

  # GitHub Pages serves the web installer and the manifest that the device's update entity checks.
  # Only the latest release is published there; older builds stay attached to their releases.
  pages:
    name: Publish to GitHub Pages
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs:
      - build-firmware
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download firmware
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: files
          merge-multiple: true

      - name: Assemble site
        run: |
          mkdir -p site/firmware
          cp -r static/. site/
          device=$(ls files)
          cp -r "files/$device/$VERSION" "site/firmware/$VERSION"
          jq --arg version "$VERSION" \
            '.builds[].ota.path |= $version + "/" + . | (.builds[].parts // [])[].path |= $version + "/" + .' \
            "files/$device/$VERSION/manifest.json" > site/firmware/manifest.json
          sed -i "s/__VERSION__/$VERSION/g" site/index.html
          find site -type f

      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
          retention-days: 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
